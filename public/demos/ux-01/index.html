<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formix · Constructor de formularios</title>
  <meta name="description" content="Prototipo: crea formularios con preguntas que aparecen solo cuando hacen falta, y pruébalos antes de publicarlos." />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="site.css" />
</head>
<body>
  <a class="skip" href="#contenido">Saltar al contenido</a>

  <header class="sitenav">
    <a class="back-link" href="../../#/proyectos" target="_top" data-solo-fuera>← Portafolio</a>
    <a class="brand" href="#/inicio" aria-label="Formix, ir al inicio">
      <span class="brand-mark" aria-hidden="true"></span>Formix
    </a>
    <button type="button" class="menu-btn" aria-expanded="false" aria-controls="nav-links">Menú</button>
    <nav aria-label="Principal">
      <ul id="nav-links" class="nav-links">
        <li><a href="#/inicio" data-route="inicio">Inicio</a></li>
        <li><a href="#/plantillas" data-route="plantillas">Plantillas</a></li>
        <li><a href="#/editor" data-route="editor">Editor</a></li>
        <li><a href="#/mis-formularios" data-route="mis-formularios">Mis formularios</a></li>
        <li><a href="#/ayuda" data-route="ayuda">Ayuda</a></li>
      </ul>
    </nav>
    <a class="btn primary nav-cta" href="#/editor">Crear formulario</a>
  </header>

  <div id="contenido">
    <!-- Página del editor (la aplicación) -->
    <section id="view-editor" hidden aria-labelledby="h-editor">
      <div class="topbar">
        <div class="title-group">
          <h1 id="h-editor" tabindex="-1">Editor</h1>
          <label class="sr-only" for="form-name">Nombre del formulario</label>
          <input id="form-name" class="form-name" type="text" autocomplete="off" />
          <button type="button" class="primary" data-action="save" id="btn-save">Guardar</button>
        </div>
        <div class="toolbar" role="toolbar" aria-label="Acciones del editor">
          <button type="button" data-action="undo" id="btn-undo" title="Deshacer (Ctrl+Z)">↶ Deshacer</button>
          <button type="button" data-action="redo" id="btn-redo" title="Rehacer (Ctrl+Y)">↷ Rehacer</button>
          <span class="sep" aria-hidden="true"></span>
          <div class="seg" role="group" aria-label="Modo">
            <button type="button" data-action="mode" data-mode="build" aria-pressed="true">Construir</button>
            <button type="button" data-action="mode" data-mode="run" aria-pressed="false">Simular</button>
          </div>
        </div>
      </div>
      <main id="main" tabindex="-1"></main>
    </section>

    <!-- Páginas informativas (inicio, plantillas, mis formularios, ayuda) -->
    <main id="view-page" tabindex="-1"></main>
  </div>

  <p id="status" class="sr-only" role="status" aria-live="polite"></p>

  <script type="module" src="src/site.js"></script>
</body>
</html>
